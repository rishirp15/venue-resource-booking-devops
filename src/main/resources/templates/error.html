<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/fragments :: head('Page Not Found')}">
    <meta charset="UTF-8">
    <title>Error | Venue Resource Booking</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <!-- Reusable Navbar -->
    <nav th:replace="~{layout/fragments :: navbar('')}"></nav>

    <!-- Main Container -->
    <main class="page-wrapper">
        <div style="max-width: 600px; margin: 3rem auto; text-align: center; padding: 2.5rem 1.5rem;" class="card">
            <div style="font-size: 4rem; font-weight: 800; color: var(--navy-900); line-height: 1;" th:text="${status != null ? status : '404'}">
                404
            </div>
            
            <h1 style="font-size: 1.5rem; margin-top: 1rem; color: var(--navy-900);">
                <span th:if="${status == 404 or status == null}">Page or Resource Not Found</span>
                <span th:if="${status != null and status != 404}" th:text="${error != null ? error : 'An Error Occurred'}">An Error Occurred</span>
            </h1>

            <p style="color: var(--gray-600); font-size: 1rem; margin: 1rem 0 2rem;">
                The page or booking destination you requested does not exist or may have been moved.
            </p>

            <div style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
                <a th:href="@{/}" class="btn btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    Return to Dashboard
                </a>
                <a th:href="@{/venues}" class="btn btn-secondary">
                    View All Venues
                </a>
            </div>
        </div>
    </main>

    <!-- Reusable Footer -->
    <footer th:replace="~{layout/fragments :: footer}"></footer>

</body>
</html>
