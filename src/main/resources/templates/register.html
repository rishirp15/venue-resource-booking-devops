<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/fragments :: head('Create Account')}">
    <meta charset="UTF-8">
    <title>Create Account | Venue Resource Booking</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="auth-wrapper">
        <div class="auth-card">

            <div class="auth-header">
                <div class="auth-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <line x1="19" y1="8" x2="19" y2="14"/>
                        <line x1="22" y1="11" x2="16" y2="11"/>
                    </svg>
                </div>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">
                    Register to reserve seminar halls, conference rooms, and labs.
                </p>
            </div>

            <!-- Error Notification Alert -->
            <div th:replace="~{layout/fragments :: alerts}"></div>

            <!-- Registration Form -->
            <form th:action="@{/register}" method="post">
                <!-- CSRF Protection -->
                <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}">

                <div class="form-group">
                    <label class="form-label" for="name">Full Name</label>
                    <input type="text" id="name" name="name" class="form-control"
                           placeholder="e.g. John Doe" autocomplete="name" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control"
                           placeholder="e.g. user@venue.com" autocomplete="email" required>
                    <p class="form-text">We'll use this for booking notifications.</p>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="Enter your password" autocomplete="new-password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem; padding: 0.75rem;">
                    Create Account
                </button>
            </form>

            <div class="auth-footer">
                <p>
                    Already have an account?
                    <a th:href="@{/login}">Sign in here</a>
                </p>
                <p style="margin-top: 0.75rem;">
                    <a th:href="@{/}" style="color: var(--gray-500); font-weight: normal;">&larr; Back to Homepage</a>
                </p>
            </div>

        </div>
    </div>

</body>
</html>
