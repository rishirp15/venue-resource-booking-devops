<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Bookings | Venue Booking</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <h2>Venue Booking</h2>

        <div>
            <a th:href="@{/}">Home</a>
            <a th:href="@{/venues}">Venues</a>

            <!-- Logout Form with CSRF Protection -->
            <form th:action="@{/logout}" method="post" class="logout-form">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <button type="submit" class="nav-logout">
                    Logout
                </button>

            </form>
        </div>

    </nav>

    <!-- Main Content -->
    <main class="container">

        <h1>My Bookings</h1>

        <p>
            Track your venue reservations and manage active bookings.
        </p>

        <!-- Booking Submission Success Message -->
        <div class="alert success" th:if="${param.success}">
            Booking request submitted successfully!
        </div>

        <!-- General Success Message -->
        <div class="alert success" th:if="${successMessage}" th:text="${successMessage}">
        </div>

        <!-- Error Message -->
        <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}">
        </div>

        <!-- Empty Booking List -->
        <p th:if="${#lists.isEmpty(bookings)}">
            You have not made any bookings yet.
        </p>

        <!-- Booking Table -->
        <div class="table-responsive" th:unless="${#lists.isEmpty(bookings)}">

            <table class="booking-table">

                <thead>
                    <tr>
                        <th>Booking ID</th>
                        <th>Venue</th>
                        <th>Date</th>
                        <th>Slot</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="booking : ${bookings}">

                        <!-- Booking ID -->
                        <td th:text="${booking.id}">
                            1
                        </td>

                        <!-- Venue Name -->
                        <td th:text="${booking.venue.name}">
                            Venue Name
                        </td>

                        <!-- Booking Date -->
                        <td th:text="${booking.bookingDate}">
                            Date
                        </td>

                        <!-- Time Slot -->
                        <td th:text="${booking.slot}">
                            Slot
                        </td>

                        <!-- Booking Status -->
                        <td>

                            <span class="status-badge" th:classappend="${booking.status}" th:text="${booking.status}">
                                PENDING
                            </span>

                        </td>

                        <!-- Booking Actions -->
                        <td>

                            <!-- Cancel Pending or Confirmed Booking -->
                            <form th:if="${booking.status == 'PENDING'
                                          or booking.status == 'CONFIRMED'}"
                                th:action="@{/bookings/{id}/cancel(id=${booking.id})}" method="post"
                                onsubmit="return confirm('Cancel this booking?');">

                                <!-- CSRF Protection -->
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                                <button type="submit" class="btn btn-danger">
                                    Cancel
                                </button>

                            </form>

                            <!-- Already Cancelled Booking -->
                            <span th:if="${booking.status == 'CANCELLED'}">
                                Cancelled
                            </span>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

        <!-- Navigation Actions -->
        <div class="actions">

            <a class="btn" th:href="@{/venues}">
                Book Another Venue
            </a>

        </div>

    </main>

</body>

</html>
