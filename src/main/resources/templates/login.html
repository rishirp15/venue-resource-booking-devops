<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Venue Booking</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="container form-container">

        <h1>Login</h1>

        <p>
            Login to manage your venue bookings.
        </p>

        <!-- Successful registration message -->
        <div class="alert success" th:if="${param.registered}">
            Registration successful. You can now login.
        </div>

        <!-- Successful logout message -->
        <div class="alert success" th:if="${param.logout}">
            You have been logged out successfully.
        </div>

        <!-- Login error message -->
        <div class="alert error" th:if="${error}" th:text="${error}">
        </div>

        <!-- Login form -->
        <form th:action="@{/login}" method="post">

            <!-- CSRF protection -->
            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}">

            <div class="form-group">
                <label for="email">Email</label>

                <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input type="password" id="password" name="password" placeholder="Enter password"
                    autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn">
                Login
            </button>

        </form>

        <p class="form-footer">
            Don't have an account?
            <a th:href="@{/register}">Register here</a>
        </p>

        <p>
            <a th:href="@{/}">Back to Home</a>
        </p>

    </div>

</body>

</html>
