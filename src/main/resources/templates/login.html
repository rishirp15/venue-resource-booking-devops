<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/fragments :: head('Sign In')}">
    <meta charset="UTF-8">
    <title>Sign In | Venue Resource Booking</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="auth-wrapper">
        <div class="auth-card">

            <div class="auth-header">
                <div class="auth-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
                        <line x1="16" x2="16" y1="2" y2="6"/>
                        <line x1="8" x2="8" y1="2" y2="6"/>
                        <line x1="3" x2="21" y1="10" y2="10"/>
                    </svg>
                </div>
                <h1 class="auth-title">Sign In</h1>
                <p class="auth-subtitle">
                    Enter your credentials to manage your venue bookings.
                </p>
            </div>

            <!-- Alerts for Registration Success, Logout, or Login Error -->
            <div th:replace="~{layout/fragments :: alerts}"></div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post">
                <!-- CSRF Protection -->
                <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}">

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control"
                           placeholder="e.g. user@venue.com" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="Enter your password" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem; padding: 0.75rem;">
                    Sign In
                </button>
            </form>

            <div class="auth-footer">
                <p>
                    Don't have an account?
                    <a th:href="@{/register}">Register here</a>
                </p>
                <p style="margin-top: 0.75rem;">
                    <a th:href="@{/}" style="color: var(--gray-500); font-weight: normal;">&larr; Back to Homepage</a>
                </p>
            </div>

        </div>
    </div>

</body>
</html>
