spring.application.name=venue-booking

# Active profile: defaults to 'dev' (H2 embedded file database), set to 'prod' for PostgreSQL
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8081}

# View and Template configuration
spring.thymeleaf.cache=false

# Session security configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Optional Email Notifications Configuration
# When EMAIL_ENABLED is true, SMTP settings are used to send booking notifications.
# If not enabled or misconfigured, application continues working without errors.
app.notifications.email.enabled=${EMAIL_ENABLED:false}
app.notifications.email.from=${EMAIL_FROM:notifications@venue.local}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
