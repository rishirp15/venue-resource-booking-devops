spring.application.name=venue-booking

# Active profile: defaults to 'dev' (H2 embedded file database), set to 'prod' for PostgreSQL
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8081}

# View and Template configuration
spring.thymeleaf.cache=false

# Session security configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
