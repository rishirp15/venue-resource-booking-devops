---
# ==============================================================================
# Ansible Playbook: Deploy Venue Resource Booking System
# Automates Docker container lifecycle, health checks, persistence & idempotency
# Supports release tracking and automated rollback state recording
# ==============================================================================
- name: Deploy Venue Resource Booking System
  hosts: deployment
  become: false
  gather_facts: false

  vars:
    app_name: venue-booking
    app_version: 1.0.0
    docker_repository: rishiphadale/venue-booking
    image_name: "{{ docker_repository }}:{{ app_version }}"
    host_port: 8081
    container_port: 8081
    spring_profile: dev
    app_data_dir: /home/hduser/venue-booking-data
    app_env_file: "{{ playbook_dir }}/app.env"
    release_state_file: "{{ playbook_dir }}/release-state.json"
    java_opts: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    stop_timeout: 20
    health_check_retries: 30
    health_check_delay: 3

  tasks:
    - name: Verify Docker is installed and running
      command: docker info
      register: docker_engine_check
      changed_when: false

    - name: Read existing release state
      command: "cat {{ release_state_file }}"
      register: existing_release_state_raw
      failed_when: false
      changed_when: false

    - name: Parse previous release version
      set_fact:
        recorded_previous_version: >-
          {{
            (existing_release_state_raw.stdout | from_json).current_version
            if (existing_release_state_raw.rc == 0 and (existing_release_state_raw.stdout | trim | length > 0) and ((existing_release_state_raw.stdout | from_json).current_version is defined))
            else '1.0.0-rc.1'
          }}

    - name: Pull application image from Docker Hub
      command: "docker pull {{ image_name }}"
      register: docker_pull
      changed_when: "'Downloaded newer image' in docker_pull.stdout"

    - name: Ensure persistent application data directory exists
      file:
        path: "{{ app_data_dir }}"
        state: directory
        mode: '0755'

    - name: Render container environment configuration from Jinja2 template
      template:
        src: templates/app.env.j2
        dest: "{{ app_env_file }}"
        mode: '0640'
      register: env_template

    - name: Retrieve target image ID
      command: "docker image inspect --format='{{ '{{' }} .Id {{ '}}' }}' {{ image_name }}"
      register: target_image_id
      changed_when: false

    - name: Inspect existing application container state
      command: "docker inspect --format='{{ '{{' }} .State.Running {{ '}}' }}|{{ '{{' }} .Image {{ '}}' }}' {{ app_name }}"
      register: existing_container_inspect
      failed_when: false
      changed_when: false

    - name: Determine container redeployment requirement
      set_fact:
        needs_redeploy: >-
          {{
            (existing_container_inspect.rc != 0) or
            (not existing_container_inspect.stdout.startswith('true|')) or
            (target_image_id.stdout not in existing_container_inspect.stdout) or
            (docker_pull.changed) or
            (env_template.changed)
          }}

    - name: Gracefully stop existing application container
      command: "docker stop --time {{ stop_timeout }} {{ app_name }}"
      when: (needs_redeploy | bool) and (existing_container_inspect.rc == 0)

    - name: Remove existing application container
      command: "docker rm -f {{ app_name }}"
      when: (needs_redeploy | bool) and (existing_container_inspect.rc == 0)

    - name: Start Venue Booking application container
      command: >
        docker run -d
        --name {{ app_name }}
        --restart unless-stopped
        -p {{ host_port }}:{{ container_port }}
        --env-file {{ app_env_file }}
        -v {{ app_data_dir }}:/app/data
        {{ image_name }}
      when: needs_redeploy | bool

    - name: Verify application health endpoint
      uri:
        url: "http://127.0.0.1:{{ host_port }}/health"
        method: GET
        return_content: yes
        status_code: 200
      register: health_check
      until: health_check.status == 200
      retries: "{{ health_check_retries }}"
      delay: "{{ health_check_delay }}"
      changed_when: false

    - name: Retrieve running container health status
      command: "docker inspect --format='{{ '{{' }} .State.Status {{ '}}' }} (Health: {{ '{{' }} if .State.Health {{ '}}' }}{{ '{{' }} .State.Health.Status {{ '}}' }}{{ '{{' }} else {{ '}}' }}none{{ '{{' }} end {{ '}}' }})' {{ app_name }}"
      register: container_health_status
      changed_when: false

    - name: Record release state upon successful deployment
      template:
        src: templates/release-state.json.j2
        dest: "{{ release_state_file }}"
        mode: '0640'
      vars:
        current_version: "{{ app_version }}"
        previous_version: "{{ recorded_previous_version }}"
        release_status: "HEALTHY"
      when: (needs_redeploy | bool) or (existing_release_state_raw.stdout | trim | length == 0)

    - name: Display deployment verification summary
      debug:
        msg:
          - "========================================================"
          - " Venue Booking Application Deployed Successfully"
          - "========================================================"
          - "Container Name   : {{ app_name }}"
          - "Image Tag        : {{ image_name }}"
          - "Image ID         : {{ target_image_id.stdout }}"
          - "Container Status : {{ container_health_status.stdout }}"
          - "Host Port        : {{ host_port }}"
          - "Health URL       : http://127.0.0.1:{{ host_port }}/health"
          - "Health Status    : {{ health_check.status }}"
          - "Active Version   : {{ app_version }}"
          - "Previous Version : {{ recorded_previous_version }}"
          - "Redeployed       : {{ needs_redeploy | bool }}"
          - "========================================================"
